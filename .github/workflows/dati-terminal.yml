name: Dati del Terminal

# Scarica prezzi e grafici (yfinance), serie economiche (FRED), documenti SEC (EDGAR), il calendario economico (Forex Factory)
# e le notizie di Yahoo Finance con il tono calcolato da FinBERT; legge ad alta voce il riepilogo del giorno (voce di Gemini, Kokoro di riserva);
# calcola i segnali dello screener dei titoli (in screener/, non pubblico) e come sono andati i titoli pubblicati; aggiorna i titoli
# dentro gli indici della mappa (scripts/indici.py). Salva i file in site/data
# e li pubblica su main, come fanno i giri delle notizie e delle chiusure. Non usa crediti Claude.
on:
  schedule:
    # orari in UTC: a Roma è un'ora in più d'inverno, due d'estate
    - cron: "47 5 * * 1-5"    # prima dell'apertura europea
    - cron: "17 11 * * 1-5"   # metà giornata
    - cron: "52 16 * * 1-5"   # dopo la chiusura delle Borse europee
    - cron: "23 21 * * 1-5"   # dopo la chiusura di Wall Street
    - cron: "13 9 * * 6"      # sabato: cripto e notizie del venerdì sera
  workflow_dispatch:
  # anche dopo ogni edizione pubblicata (gli orari del cron di GitHub non sono garantiti e a volte saltano)
  # e quando cambiano gli script del job; le edizioni del workflow «Redazione» lo avviano con workflow_dispatch,
  # perché i push fatti con il token di GitHub non fanno partire altri workflow
  push:
    branches: [main]
    paths: [site/data/edition.json, site/data/riepilogo.json, scripts/fin_data.py, scripts/audio.py, scripts/sigla.py, "scripts/sigla/**", scripts/screener.py, scripts/titoli_storico.py, scripts/fin_requirements.txt, scripts/societari.py]

permissions:
  contents: write

concurrency:
  group: dati-terminal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dati:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/fin_requirements.txt
      - name: Modello FinBERT in cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-prosusai-1
      - name: Voce del riepilogo in cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1-int8
      - name: Librerie
        run: |
          python -m pip install -q --upgrade pip
          pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r scripts/fin_requirements.txt
      - name: Scarica i dati
        run: python scripts/fin_data.py site/data
      - name: Dentro gli indici della mappa
        # i titoli di ogni indice con peso e variazione (scripts/indici.py); se non riesce restano i dati di prima
        continue-on-error: true
        timeout-minutes: 8
        env:
          INDICI_SECONDI: "300"
        run: python scripts/indici.py site/data
      - name: Trimestrali e cedole
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/societari.py site/data
      - name: Riepilogo audio
        env:
          # la voce di Gemini (livello gratuito dell'API); senza chiave, o se il servizio non risponde, legge Kokoro.
          # GERICO_VOCE (Settings › Secrets and variables › Actions › Variables) cambia la voce senza toccare il codice
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GERICO_VOCE: ${{ vars.GERICO_VOCE }}
        run: python scripts/audio.py site
      - name: Screener dei titoli
        run: python scripts/screener.py screener
      - name: Storico dei titoli da seguire
        run: python scripts/titoli_storico.py site/data
      - name: Controlla il sito
        run: python scripts/check_site.py site
      - name: Pubblica
        run: |
          git config user.name "GERICO"
          git config user.email "gerico@users.noreply.github.com"
          for f in quotes macro sec sentiment audio calendario societari; do
            if [ -f "site/data/$f.json" ]; then git add "site/data/$f.json"; fi
          done
          if [ -f site/audio/riepilogo.m4a ]; then git add site/audio/riepilogo.m4a; fi
          if [ -d site/data/indici ]; then git add site/data/indici; fi
          for f in screener/candidati.json site/data/titoli-storico.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo "Niente di nuovo."; exit 0; fi
          git commit -q -m "Dati del Terminal del $(TZ=Europe/Rome date '+%-d/%-m alle %H:%M')"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          echo "::error::Push non riuscito dopo 4 tentativi"
          exit 1
