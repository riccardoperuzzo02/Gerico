name: Indici

# Dentro gli indici della mappa del Terminal: i titoli di ogni indice, quanto pesano e come vanno oggi
# (scripts/indici.py, file in site/data/indici). I prezzi li aggiorna anche «Dati del Terminal» a ogni giro;
# questo workflow serve a rifare a mano la composizione o a provare lo script. Non usa crediti Claude.
on:
  workflow_dispatch:
    inputs:
      composizione:
        description: Rifai l'elenco dei titoli e i pesi
        type: boolean
        default: false
      solo:
        description: "Solo questi codici, separati da virgole (es. USA,ITA); vuoto per tutti"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: dati-terminal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  indici:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/prezzi_requirements.txt
      - name: Librerie
        run: pip install -q -r scripts/prezzi_requirements.txt lxml
      - name: Indici
        env:
          INDICI_COMPOSIZIONE: ${{ inputs.composizione && '1' || '' }}
          INDICI_SOLO: ${{ inputs.solo }}
        run: python -u scripts/indici.py site/data
      - name: Pubblica
        run: |
          git config user.name "GERICO"
          git config user.email "gerico@users.noreply.github.com"
          git add site/data/indici
          if git diff --cached --quiet; then echo "Niente di nuovo."; exit 0; fi
          git commit -q -m "Indici del $(TZ=Europe/Rome date '+%-d/%-m alle %H:%M')"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          echo "::error::Push non riuscito dopo 4 tentativi"
          exit 1
