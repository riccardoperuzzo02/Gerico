name: Prezzi

# I prezzi di Borse, valute, tassi Usa, materie prime e cripto (Yahoo Finance, tramite yfinance) ogni mezz'ora nelle ore
# di mercato dei giorni feriali: solo site/data/quotes.json, in circa un minuto. Il job «Dati del Terminal» resta per il
# resto (macro, SEC, tono delle notizie, riepilogo a voce, screener) e quattro volte al giorno scarica anche lui i prezzi.
# Un aggiornamento usa circa un minuto di GitHub Actions: 32 al giorno, circa 700 minuti al mese.
on:
  schedule:
    # orari in UTC: dalle 7 alle 22:40 di Roma d'inverno (8-23:40 d'estate), ai minuti 7 e 37, lontano dall'ora piena
    # quando i timer di GitHub ritardano di più. Copre la chiusura dell'Asia, le Borse europee e Wall Street
    - cron: "7,37 6-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# lo stesso gruppo del job «Dati del Terminal»: mai due giri insieme sullo stesso file
concurrency:
  group: dati-terminal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prezzi:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/prezzi_requirements.txt
      - name: Librerie
        run: pip install -q -r scripts/prezzi_requirements.txt
      - name: Scarica i prezzi
        env:
          FIN_ONLY: quotes
        run: python scripts/fin_data.py site/data
      - name: Pubblica
        run: |
          git config user.name "GERICO"
          git config user.email "gerico@users.noreply.github.com"
          # il file nuovo si rimette ogni volta sopra l'ultima versione di main: nessun conflitto con chi ha pubblicato intanto
          cp site/data/quotes.json "$RUNNER_TEMP/quotes.json"
          for i in 1 2 3 4; do
            git fetch -q --depth 1 origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD
            cp "$RUNNER_TEMP/quotes.json" site/data/quotes.json
            git add site/data/quotes.json
            if git diff --cached --quiet; then echo "Niente di nuovo."; exit 0; fi
            git commit -q -m "Prezzi del $(TZ=Europe/Rome date '+%-d/%-m alle %H:%M')"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((i * 10))
          done
          echo "::error::Push non riuscito dopo 4 tentativi"
          exit 1
