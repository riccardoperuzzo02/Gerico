name: Prove voce

# Campioni della voce con modelli che si scaricano da Hugging Face (dal container di Claude non si raggiunge).
# Gira solo sul ramo prove-voce e salva i file nello stesso ramo. Non tocca main e il sito.
on:
  push:
    branches: [prove-voce]
    paths: [prove/testo.txt, prove/chatterbox.py, prove/ref_nicola.wav, .github/workflows/prove-voce.yml]

permissions:
  contents: write

jobs:
  voce:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Librerie
        run: |
          mkdir -p prove/out
          python -m pip install -q --upgrade pip
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -20 | tee prove/out/log-pip.txt
          pip install chatterbox-tts==0.1.7 num2words imageio-ffmpeg soundfile > prove/out/log-pip2.txt 2>&1 || (tail -60 prove/out/log-pip2.txt; exit 1)
          tail -5 prove/out/log-pip2.txt
      - name: Campioni
        run: python prove/chatterbox.py prove/out 2>&1 | tee prove/out/log-campioni.txt; exit ${PIPESTATUS[0]}
      - name: Salva nel ramo
        if: always()
        run: |
          git config user.name "GERICO"
          git config user.email "gerico@users.noreply.github.com"
          git add prove/out
          git commit -q -m "Campioni della voce (Chatterbox)" || true
          git push -q origin HEAD:prove-voce
