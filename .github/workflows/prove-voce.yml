name: Prove voce

# Campioni della voce con modelli che si scaricano da Hugging Face (dal container di Claude non si raggiunge).
# Gira solo sul ramo prove-voce e salva i file nello stesso ramo. Non tocca main e il sito.
on:
  push:
    branches: [prove-voce]
    paths: [prove/testo.txt, prove/chatterbox.py, prove/ref_nicola.wav, .github/workflows/prove-voce.yml]

permissions:
  contents: write

jobs:
  voce:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Librerie
        run: |
          python -m pip install -q --upgrade pip
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts==0.1.7 num2words imageio-ffmpeg soundfile
      - name: Campioni
        run: python prove/chatterbox.py prove/out
      - name: Salva nel ramo
        run: |
          git config user.name "GERICO"
          git config user.email "gerico@users.noreply.github.com"
          git add prove/out
          git commit -q -m "Campioni della voce (Chatterbox)"
          git push -q origin HEAD:prove-voce
