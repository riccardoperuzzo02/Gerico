name: Redazione

# I giri della redazione di GERICO, senza chat su Claude: notizie alle 7:18 e alle 13:18, i paesi (Stati Uniti, Regno
# Unito, Francia, Germania, Spagna) alle 9:47, chiusure delle Borse europee alle 18:15 dei giorni feriali; i titoli da
# seguire restano spenti finché non arriva l'ok della compliance.
# Claude Code usa l'abbonamento Claude di Riccardo (segreto CLAUDE_CODE_OAUTH_TOKEN, creato con `claude setup-token`),
# legge le testate e scrive il database in redazione/db; poi scripts/redazione.py lo copia in site/data con gli
# script di sempre, pubblica su main e, se è cambiato il riepilogo, avvia «Dati del Terminal» per l'audio.
# Il giro «prova» controlla solo che il token funzioni e che la pubblicazione passi, senza cambiare niente.
on:
  # accesi il 10 novembre 2026, con le attività programmate su Claude spente: due redazioni insieme si pestano i piedi
  schedule:
    # orari in UTC: per ogni giro un cron per l'ora legale e uno per l'ora solare; parte solo quello giusto
    - cron: "18 5 * * *"      # notizie 7:18 (ora legale)
    - cron: "18 6 * * *"      # notizie 7:18 (ora solare)
    - cron: "47 7 * * *"      # paesi 9:47 (ora legale)
    - cron: "47 8 * * *"      # paesi 9:47 (ora solare)
    - cron: "18 11 * * *"     # notizie 13:18 (ora legale)
    - cron: "18 12 * * *"     # notizie 13:18 (ora solare)
    - cron: "15 16 * * 1-5"   # chiusure 18:15 (ora legale)
    - cron: "15 17 * * 1-5"   # chiusure 18:15 (ora solare)
  workflow_dispatch:
    inputs:
      giro:
        description: Giro da fare
        type: choice
        options: [prova, notizie, paesi, chiusure, titoli]
        default: prova
      variante:
        description: "Per le notizie: giro delle 7:18 o delle 13:18 (auto: 7:18 prima delle 11)"
        type: choice
        options: [auto, "7:18", "13:18"]
        default: auto

permissions:
  contents: write
  actions: write

concurrency:
  group: redazione
  cancel-in-progress: false

jobs:
  giro:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Quale giro
        id: giro
        env:
          SCHEDULE: ${{ github.event.schedule }}
          SCELTA: ${{ inputs.giro }}
          VARIANTE: ${{ inputs.variante }}
        run: python3 scripts/redazione.py giro | tee -a "$GITHUB_OUTPUT"

      - name: Token
        if: steps.giro.outputs.giro != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # il token copiato dal terminale si porta dietro l'a capo della riga spezzata: un token non ha spazi, si tolgono
          token=$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')
          if [ -z "$token" ]; then
            echo "::error::Manca il segreto CLAUDE_CODE_OAUTH_TOKEN: crealo con «claude setup-token» e aggiungilo in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "::add-mask::$token"
          if [ "$token" != "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::notice::Il segreto CLAUDE_CODE_OAUTH_TOKEN ha spazi o a capo (copiato da una riga spezzata): il giro li toglie prima di usarlo."
          fi
          case "$token" in
            sk-ant-*) ;;
            *) echo "::warning::Il segreto CLAUDE_CODE_OAUTH_TOKEN non comincia con «sk-ant-»: forse non è il token di «claude setup-token»." ;;
          esac

      - name: Claude Code
        if: steps.giro.outputs.giro != ''
        run: |
          for i in 1 2 3; do
            if curl -fsSL https://claude.ai/install.sh | bash; then break; fi
            if [ "$i" = 3 ]; then echo "::error::Installazione di Claude Code non riuscita"; exit 1; fi
            sleep 10
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Giro
        id: claude
        if: steps.giro.outputs.giro != ''
        timeout-minutes: 40
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GIRO: ${{ steps.giro.outputs.giro }}
          VARIANTE: ${{ steps.giro.outputs.variante }}
          MODELLO: ${{ steps.giro.outputs.modello }}
          TURNI: ${{ steps.giro.outputs.turni }}
        run: |
          # come nel passo Token: il token senza gli spazi e gli a capo della copia dal terminale
          CLAUDE_CODE_OAUTH_TOKEN=$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$CLAUDE_CODE_OAUTH_TOKEN"
          export CLAUDE_CODE_OAUTH_TOKEN
          if [ "$GIRO" = prova ]; then
            echo "Rispondi solo con la parola: pronto" > "$RUNNER_TEMP/prompt.md"
          else
            { printf 'Questo è il giro delle %s.\n\n' "$VARIANTE"; cat "redazione/$GIRO.md"; } > "$RUNNER_TEMP/prompt.md"
          fi
          # Claude scrive solo nel database e usa solo questi comandi: niente git, niente altro sul runner
          # (ogni regola nelle due forme, «comando *» e la vecchia «comando:*»)
          TOOLS=(WebSearch WebFetch Read Glob Grep "Edit(redazione/db/**)" "Write(redazione/db/**)"
                 "Bash(TZ=Europe/Rome date *)" "Bash(date *)" "Bash(TZ=Europe/Rome date:*)" "Bash(date:*)"
                 "Bash(python3 scripts/redazione.py *)" "Bash(python3 scripts/check_dump.py *)"
                 "Bash(python3 scripts/redazione.py:*)" "Bash(python3 scripts/check_dump.py:*)")
          # il limite di tempo è dentro il passo, così l'esito e la pubblicazione arrivano comunque
          timeout --foreground 36m claude -p --model "$MODELLO" --max-turns "$TURNI" --output-format stream-json --verbose \
            --allowedTools "${TOOLS[@]}" < "$RUNNER_TEMP/prompt.md" > "$RUNNER_TEMP/giro.jsonl" || true
          # esito scrive risposta=si (giro finito), interrotta (ha lavorato ma non ha finito: si pubblica quello che ha
          # scritto) oppure no (non ha lavorato: accesso non riuscito, limite dell'abbonamento, errore prima di cominciare)
          python3 scripts/redazione.py esito "$RUNNER_TEMP/giro.jsonl" || true

      - name: Trascrizione del giro
        if: always() && steps.giro.outputs.giro != ''
        uses: actions/upload-artifact@v4
        with:
          name: giro-${{ steps.giro.outputs.giro }}-${{ github.run_id }}
          path: ${{ runner.temp }}/giro.jsonl
          retention-days: 7
          if-no-files-found: ignore

      # anche un giro interrotto pubblica quello che ha scritto nel database; uno che non è partito no
      - name: Pubblica
        id: pubblica
        if: always() && steps.giro.outputs.giro != '' && steps.claude.outputs.risposta != 'no' && steps.claude.outputs.risposta != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GIRO: ${{ steps.giro.outputs.giro }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python3 scripts/redazione.py pubblica "$GIRO"

      - name: Dati del Terminal e audio del riepilogo
        if: always() && steps.pubblica.outputs.terminal == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dati-terminal.yml --ref main

      - name: Esito
        if: always() && steps.giro.outputs.giro != ''
        env:
          RISPOSTA: ${{ steps.claude.outputs.risposta }}
        run: |
          if [ "$RISPOSTA" = no ] || [ -z "$RISPOSTA" ]; then
            echo "::error::Claude Code non ha lavorato e non è uscito niente: il motivo è nel passo Giro (token non valido o scaduto dopo un anno, limite dell'abbonamento, errore prima di cominciare)."
            exit 1
          fi
          if [ "$RISPOSTA" = interrotta ]; then
            echo "::warning::Il giro si è fermato prima della fine (tempo, turni o limite dell'abbonamento): è uscito quello che aveva scritto."
          fi
